<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Footer RWD</title>
  <style>
    

    /* =========================
       Footer區塊（切版：上 1920*440、下 1920*544）
       ========================= */
    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .footer{
      margin-top:auto;
      background:
        radial-gradient(900px 420px at 20% 0%, rgba(255,190,140,.10), transparent 60%),
        radial-gradient(900px 420px at 90% 40%, rgba(180,120,255,.10), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0));
      border-top: 4px solid rgba(170,70,255,.6); /* 畫面上方紫線示意 */
    }

    /* 讓整個footer高度對應你給的兩段尺寸（以1920寬為基準比例縮放） */
    .footer__inner{
      max-width: 1920px;
      margin: 0 auto;
      padding: 0;
    }

    /* 你要的「上 1920*440」 */
    .footer__top{
      height: 440px;           /* 目標切版高度 */
      padding-left: var(--padX);
      padding-right: var(--padX);
      padding-top: var(--padY);
      padding-bottom: 14px; /* 視覺微調 */
      display:grid;
      grid-template-columns: 1.05fr .95fr;
      gap: clamp(14px, 3vw, 56px);
      align-items:start;
    }

    /* 你要的「下 1920*544」 */
    .footer__bottom{
      height: 544px;           /* 目標切版高度 */
      padding-left: var(--padX);
      padding-right: var(--padX);
      padding-top: clamp(18px, 3.2vw, 40px);
      padding-bottom: clamp(18px, 3vw, 40px);
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(18px, 3vw, 56px);
      align-items:start;
    }

    /* ========= 左側內容（Contact） ========= */
.contact-bg {
  background-color:var(--primary-900);
}


.contact {
  display: flex;
  justify-content: space-between;
  padding: 80px 0;
  flex-wrap: wrap;
  width: 100%;
    @media (max-width: 576px) {
    flex-direction: column;
  }
}

.contact-info {
  display: flex;
  justify-content: flex-start;
  flex-direction: column;
  flex: 5;
  @media (max-width: 576px) {
    padding: 0;
  }
}

.contact-title {
  color: var(--neutral-0);
  font-family: "Noto Sans", sans-serif;
  font-weight: 700;
}

.contact-title h2 {
  font-size: 80px;
  line-height: 1.2;
  @media (max-width: 768px) {
    font-size: 60px;
  }
    @media (max-width: 576px) {
    font-size: 40px;
  }
}

.contact-desc {
  color: var(--neutral-0);
  font-family: "Noto Sans", sans-serif;
  font-weight: 500;  
}

.contact-social {
  color: var(--neutral-0);
  font-family: "Noto Sans", sans-serif;
  font-weight: 500;  
  padding-top: 68px;
  display: flex;
  flex-direction: column;
}

.contact-social ul{
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.contact-social ul li{
  width: 40px;
  height: 40px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--neutral-0);
  aspect-ratio: 1 / 1;
  border-radius: 50%;
    &:hover {
      color: var(--primary-500);
      border: 1px solid var(--primary-500);
      cursor: pointer;
    }
}

.bi {
  font-size: 16px;
}

.contact-email {
  display: flex;
  align-items: center;
  max-width: 100%;
  min-width: 0;
  flex-wrap: wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
   .icon {
    font-size: 18px;
    margin-right: 8px;
    flex-shrink: 0;
  }
    &:hover {
    color: var(--primary-500);
    cursor: pointer;
  }
}

.contact-form {
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding: 0 40px;
  flex: 7;
  @media (max-width: 576px) {
    padding: 0;
  }
}

.form-row {
  display: flex;
  gap: 24px;
  @media (max-width: 576px) {
   flex-direction: column;
  }
}

.form-input {
  width: 100%;
  color: var(--neutral-0);
  background: transparent;
  border: 1px solid var(--neutral-0);
  border-radius: 40px;
  outline: none;
  padding: 20px 32px;
  @media (max-width: 576px) {
      padding: 16px 20px;
  }
}

.form-input::placeholder {
  color: var(--neutral-0);
}

.form-textarea {
  color: var(--neutral-0);
  background: transparent;
  width: 100%;
  height: 136px;
  border: 1px solid var(--neutral-0);
  border-radius: 40px;
  outline: none;
  resize: none;
  padding: 20px 32px;
    @media (max-width: 576px) {
      padding: 16px 20px;
  }
}

.form-textarea::placeholder {
  color: var(--neutral-0);
}

.form-submit {
  color: var(--neutral-700);
  background: var(--neutral-0);
  width: 100%; 
  border: none;
  border-radius: 40px;
  cursor: pointer;
  padding: 12px 0;
}

.form-submit:hover {
  background: #ddd0be;
}

@media (max-width: 768px) {
  .contact {
    flex-direction: column;
    padding: 40px 0;
  }

  .contact-info {
    display: contents;
    padding-bottom: 24px;
  }

  .contact-title {
    order: 1;
    margin-bottom: 12px;
  }

  .contact-desc {
    font-size: 14px;
    order: 2;
  }

  .contact-form {
    order: 3;
    width: 100%;
    padding: 0;
    margin-top: 24px;
    gap: 12px;
    border-radius: 32px;
  }

  .contact-social {
    order: 4;
    margin-top: 24px;
    padding: 0;
    width: 100%;
    gap: 12px;
  }
}

@media (max-width: 375px) {
  .sub-title h2 {
    font-size: 32px;
    line-height: 1.15;
    max-width: 100%;
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  .sub-title,
  .sub-desc,
  .sub-group {
    width: 100%;
    @media (max-width: 331px) {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
  }
  .contact-title h2 {
    font-size: 32px;
    line-height: 1.15;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
}
  </style>
</head>

<body>

   <!-- contect -->
   <section class="contact-bg" id="contactform">
    <div class="container">
      <div class="contact">
        <div class="contact-info">
          <div class="contact-title">
            <p>聯絡我</p>
            <h2>CONTACT</h2>
          </div>
          <div class="contact-desc">
            <p>有任何前端學習、職涯規劃或合作邀約，歡迎透過表單與我聯繫。</p>
            <p>填寫完表單後，我會盡快回覆你。</p>
          </div>
          <div class="contact-social">
            <ul>
              <li><a href="#" target="_blank"><i class="bi bi-instagram"></i></a></li>
              <li><a href="#" target="_blank"><i class="bi bi-line"></i></a></li>
              <li><a href="#" target="_blank"><i class="bi bi-linkedin"></i></a></li>
            </ul>
            <a href="mailto:service@hexschool.com" class="contact-email"><span
                class="material-symbols-outlined icon">drafts</span>service@hexschool.com</a>
          </div>
        </div>
  <form class="contact-form">
    <div class="form-row">
      <input class="form-input" type="text" placeholder="姓名" />
      <input class="form-input" type="tel" placeholder="手機號碼" />
    </div>
    <input class="form-input" type="email" placeholder="電子郵件信箱" />
    <textarea class="form-textarea" placeholder="留言內容"></textarea>
    <button class="form-submit">送出</button>
  </form>
</body>
</html>
